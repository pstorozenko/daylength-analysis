name: Publish to GitHub Pages

# Re-executes analysis.ipynb and publishes it (code cells hidden) as a single HTML page
# by force-pushing the rendered site to the `gh-pages` branch (Pages source: gh-pages / root).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # push to gh-pages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Render notebook to HTML
        run: |
          uv run jupyter nbconvert --to html --execute --no-input analysis.ipynb --output-dir _site --output index
          touch _site/.nojekyll
      - name: Push to gh-pages
        working-directory: _site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Publish ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
